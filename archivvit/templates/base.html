<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}archivvit{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">archivvit</a>
    <nav class="subs">
      <a href="/"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Home</a>
      {% for s in nav_subs %}
      <a href="{{ url_for('subreddit', sub=s) }}"{% if sub is defined and sub|lower == s|lower %} aria-current="page"{% endif %}>r/{{ s }}</a>
      {% endfor %}
    </nav>
    <a class="settings-link" href="{{ url_for('settings') }}"{% if request.endpoint == 'settings' %} aria-current="page"{% endif %}>Settings</a>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <p class="flash {{ cat }}">{{ msg }}</p>
    {% endfor %}
    {% endwith %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
